
name: Initialize Supabase Database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate Supabase Database
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: "5432"
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "true"
      NODE_ENV: production

    steps:
      # Step 1: Get the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Step 3: Verify required secrets are available
      - name: Validate database configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            DB_HOST
            DB_USER
            DB_PASSWORD
            DB_NAME
          )

          for variable in "${required_vars[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required secret $variable is missing."
              exit 1
            fi
          done

          echo "Database configuration is present."

      # Step 4: Install backend dependencies
      - name: Install dependencies
        run: npm ci

      # Step 5: Configure Supabase SSL certificate
      - name: Configure Supabase SSL certificate
        shell: bash
        env:
          DB_SSL_CA: ${{ secrets.DB_SSL_CA }}
        run: |
          set -euo pipefail

          if [[ -z "${DB_SSL_CA:-}" ]]; then
            echo "::error::DB_SSL_CA secret is missing."
            exit 1
          fi

          CERT_FILE="$RUNNER_TEMP/supabase-ca.crt"

          printf '%s\n' "$DB_SSL_CA" > "$CERT_FILE"
          chmod 600 "$CERT_FILE"

          # Verify that the downloaded certificate is valid PEM.
          openssl x509 -in "$CERT_FILE" -noout

          # Make Node.js trust this certificate in subsequent steps.
          echo "NODE_EXTRA_CA_CERTS=$CERT_FILE" >> "$GITHUB_ENV"

          echo "Supabase SSL certificate configured."

      # Step 6: Run database migration
      - name: Run database migration
        run: npm run migrate
