# Serves the built SPA and reverse-proxies the API + uploaded media so the
# browser only ever talks to one origin (mirrors the Vite dev proxy).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;

    # API -> Django/gunicorn backend service.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files are written by the backend to a shared volume mounted here.
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        access_log off;
        expires 7d;
    }

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
